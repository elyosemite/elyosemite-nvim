# Abre a config num Neovim sem interface, no Linux e no Windows, e falha se algo der erro.
# O teste em si está em tests/smoke.lua.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: nvim

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.12.3

      - uses: tree-sitter/setup-action@v1
        with:
          install-lib: false

      # O Neovim procura a config em $XDG_CONFIG_HOME/nvim em qualquer sistema.
      # Só nos passos do Neovim: o setup-action do tree-sitter quebra com ela definida.
      - name: Install plugins (versions from lazy-lock.json)
        env:
          XDG_CONFIG_HOME: ${{ github.workspace }}
        run: nvim --headless "+Lazy! restore" +qa

      - name: Smoke test
        env:
          XDG_CONFIG_HOME: ${{ github.workspace }}
        run: nvim --headless -c "luafile nvim/tests/smoke.lua"
